[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bul-project"
version = "1.0.0"
description = "Behavioral Utility Loss evaluation under differentially private event-log release"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "License pending maintainer selection; see LICENSE_NOTICE.md"}
authors = [
  {name = "BUL Project Authors"}
]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "matplotlib==3.10.6",
  "pm4py==2.7.23.1",
  "lxml==5.3.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bul_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: tests that require external event-log files or PM4Py execution",
  "regression: old-versus-release numerical equivalence tests",
]
